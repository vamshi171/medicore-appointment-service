server:
  port: 8084

spring:
  application:
    name: APPOINTMENT-SERVICE
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/medicore_appointments?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:medicore}
    password: ${DB_PASSWORD:medicore123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

springdoc:
  api-docs:
    path: /v3/api-docs

# --- Resilience4j (circuit breaker instances match the Feign client names) ---
resilience4j:
  circuitbreaker:
    instances:
      DOCTOR-SERVICE:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
      PATIENT-SERVICE:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
  timelimiter:
    instances:
      DOCTOR-SERVICE:
        timeout-duration: 3s
      PATIENT-SERVICE:
        timeout-duration: 3s
  retry:
    instances:
      DOCTOR-SERVICE:
        max-attempts: 2
        wait-duration: 500ms

medicore:
  jwt:
    secret: ${JWT_SECRET:medicore-dev-secret-key-change-me-in-production-0123456789abcdef}
  internal-token: ${INTERNAL_TOKEN:medicore-internal-dev-token}

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers
